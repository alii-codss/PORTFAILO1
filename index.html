<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>

<style>
/* ===== 1. RANGLAR: faqat shu yerni o‘zgartirsangiz, butun sayt rangi o‘zgaradi ===== */
:root {
  --bg: linear-gradient(135deg, #cdeeff 0%, #e9defe 55%, #ffdbe9 100%); /* sahifa foni: havorang - binafsha - pushti */
  --header: #eef3ff;
  --surface: #ffffff;   /* kartochka foni */
  --text: #1b1340;      /* asosiy matn */
  --muted: #5d5683;     /* ikkinchi matn */
  --line: #ded8f5;      /* chiziqlar */
  --main: #6d28ff;      /* asosiy rang (binafsha) */
  --pop: #ff4d8d;       /* yorqin ikkinchi rang (pushti) */
  --shadow: 0 10px 28px rgba(109, 40, 255, .12);
  --serif: Georgia, "Times New Roman", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
:root[data-theme="dark"] {
  --bg: linear-gradient(135deg, #07162f 0%, #1c0f45 60%, #3a0f3f 100%); --header: #101b38; --surface: #1d1542; --text: #f3f0ff;
  --muted: #b3abd9; --line: #33295e; --main: #9b6bff;
  --shadow: 0 10px 28px rgba(0, 0, 0, .4);
}

/* ===== 2. UMUMIY ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { font-family: var(--sans); min-height: 100vh; background: var(--bg) fixed; color: var(--text); line-height: 1.65; transition: background .3s, color .3s; }
h1, h2, h3 { font-family: var(--serif); line-height: 1.15; }
a { color: inherit; }
.container { width: min(1040px, 92%); margin-inline: auto; }
section { padding: 96px 0; }
section h2 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin-bottom: 40px; }
:focus-visible { outline: 3px solid var(--pop); outline-offset: 3px; }

/* ===== 3. TUGMALAR ===== */
.btn {
  display: inline-block; padding: 12px 26px; border-radius: 999px;
  border: 2px solid var(--main); font: 600 1rem var(--sans);
  text-decoration: none; cursor: pointer; background: transparent; color: var(--text);
  transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn.primary { background: var(--main); color: #fff; }

/* ===== 4. MENYU ===== */
header { position: sticky; top: 0; z-index: 50; background: var(--header); border-bottom: 1px solid var(--line); transition: background .3s; }
.nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { font-family: var(--serif); font-weight: 700; font-size: 1.3rem; text-decoration: none; }
.menu { display: flex; align-items: center; gap: 24px; list-style: none; }
.menu a { text-decoration: none; font-weight: 500; color: var(--muted); transition: color .2s; }
.menu a:hover { color: var(--main); }
.icon-btn, select {
  background: var(--surface); border: 1px solid var(--line); color: var(--text);
  height: 40px; border-radius: 20px; font: 600 .95rem var(--sans); cursor: pointer;
}
.icon-btn { width: 40px; font-size: 1.1rem; }
select { padding: 0 12px; }
.burger { display: none; }

/* ===== 5. HERO ===== */
.hero { padding: 80px 0 100px; }
.hero-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: center; }
.hero h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); margin-bottom: 20px; }
.hero p { font-size: 1.2rem; color: var(--muted); max-width: 46ch; margin-bottom: 32px; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; }
.badge {
  justify-self: center; width: min(300px, 70vw); aspect-ratio: 1; border-radius: 50%;
  background: linear-gradient(135deg, var(--main), var(--pop));
  color: #fff; display: grid; place-items: center;
  font: 700 5rem var(--serif); box-shadow: 0 20px 50px rgba(109, 40, 255, .35);
}

/* ===== 6. MEN HAQIMDA ===== */
.about-grid { display: grid; grid-template-columns: 240px 1fr; gap: 48px; align-items: start; }
.photo {
  aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--surface);
  border: 2px dashed var(--main); display: grid; place-items: center;
  color: var(--muted); text-align: center; padding: 12px;
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.about-text p { max-width: 60ch; color: var(--muted); font-size: 1.08rem; margin-bottom: 16px; }

/* ===== 7. KARTOCHKALAR, KO‘NIKMALAR ===== */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.skill-top { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 12px; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--main), var(--pop)); border-radius: 99px; transition: width 1.1s ease; }

/* ===== 8. LOYIHALAR ===== */
.project { padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: transform .2s; }
.project:hover { transform: translateY(-4px); }
.thumb { height: 160px; display: grid; place-items: center; font-size: 2.6rem; }
.project:nth-child(1) .thumb { background: #e4d6ff; }
.project:nth-child(2) .thumb { background: #ffd3e3; }
.project:nth-child(3) .thumb { background: #c9f3e6; }
.project:nth-child(4) .thumb { background: #fff0c2; }
.project .body { padding: 22px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.project .body, .project h3 { color: #1b1340; }
:root[data-theme="dark"] .project .body, :root[data-theme="dark"] .project h3 { color: var(--text); }
.project p { color: var(--muted); flex: 1; }
.project .btn { align-self: flex-start; padding: 8px 20px; font-size: .95rem; }

/* ===== 9. ALOQA ===== */
.contact-grid { display: grid; grid-template-columns: 1fr; gap: 48px; }
.contact-grid > div > p { color: var(--muted); margin-bottom: 24px; max-width: 42ch; }
.links { display: flex; flex-wrap: wrap; gap: 14px; }
form { display: flex; flex-direction: column; gap: 14px; }
label { font-weight: 600; font-size: .95rem; }
input, textarea { width: 100%; padding: 12px 14px; font: inherit; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 12px; }
textarea { min-height: 120px; resize: vertical; }

footer { border-top: 1px solid var(--line); padding: 28px 0; text-align: center; color: var(--muted); }

/* ===== 10. SCROLL ANIMATSIYA ===== */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s, transform .7s; }
.reveal.show { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; transition: none; }
  .bar span { transition: none; }
}

/* ===== 11. TELEFON UCHUN ===== */
@media (max-width: 800px) {
  section { padding: 64px 0; }
  .hero-grid, .about-grid, .contact-grid { grid-template-columns: 1fr; }
  .badge { order: -1; width: 180px; font-size: 3.4rem; justify-self: start; }
  .photo { max-width: 220px; }
  .burger { display: block; }
  .menu { position: absolute; top: 68px; left: 0; right: 0; flex-direction: column; gap: 0; align-items: stretch; background: var(--header); border-bottom: 1px solid var(--line); display: none; }
  .menu.open { display: flex; }
  .menu li { padding: 14px 4%; border-top: 1px solid var(--line); }
}

/* ===== 12. SICHQONCHA USTIGA KELGANDA RANG O‘ZGARISHI ===== */
.card { transition: border-color .2s, box-shadow .2s, background .2s; }
.card.project { transition: transform .2s, border-color .2s, box-shadow .2s; }
.card:hover { border-color: var(--pop); box-shadow: 0 14px 34px rgba(255, 77, 141, .28); }
.card:not(.project):hover { background: linear-gradient(135deg, var(--surface), rgba(255, 77, 141, .12)); }
.btn { transition: transform .2s, box-shadow .2s, background .2s, border-color .2s, color .2s; }
.btn:hover, .btn.primary:hover { background: var(--pop); border-color: var(--pop); color: #fff; }
.menu a:hover { color: var(--pop); }
.icon-btn:hover, select:hover { background: var(--main); border-color: var(--main); color: #fff; }
.badge { transition: transform .4s; }
.badge:hover { transform: rotate(8deg) scale(1.05); }
.logo { transition: color .2s; }
.logo:hover { color: var(--pop); }
input:hover, textarea:hover, .photo:hover { border-color: var(--main); }

/* ===== SICHQONCHA YORUG‘LIGI: sichqoncha yurganda rangi o‘zgarib turadi ===== */
.glow {
  position: fixed; left: 0; top: 0; width: 360px; height: 360px; margin: -180px 0 0 -180px;
  border-radius: 50%; pointer-events: none; z-index: -1; opacity: 0; filter: blur(28px);
  background: radial-gradient(circle, hsla(var(--h, 260), 95%, 60%, .5), transparent 65%);
  transition: opacity .4s; will-change: transform;
}

/* ===== 13. LOYIHA OYNASI ===== */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(10, 5, 30, .6); }
.modal[hidden] { display: none; }
.modal-box { background: var(--surface); color: var(--text); border-radius: 20px; padding: 28px; max-width: 420px; width: 100%; box-shadow: 0 24px 60px rgba(0, 0, 0, .4); display: flex; flex-direction: column; gap: 12px; }
.modal-box p { color: var(--muted); }
.modal-box .soon { font-weight: 600; color: var(--main); }
.modal-box .btn { align-self: flex-start; }
</style>
</head>

<script>
/* =========================================================
   1. ISMINGIZ: faqat shu yerda o‘zgartiring, hamma joyga tushadi
   ========================================================= */
const ISM = "Axadov Muhammad Ali";

/* =========================================================
   2. MATNLAR VA TILLAR
   Yangi til qo‘shish: ru blokini nusxalab, nomini (masalan tr) o‘zgartiring,
   tarjimasini yozing, keyin yuqoridagi <select> ga <option value="tr">TR</option> qo‘shing.

const T = {

/* =========================================================
   3. TILNI ALMASHTIRISH
   ========================================================= */
const langSelect = document.getElementById('lang');
let lang = 'uz';

function setLang(code) {
  lang = T[code] ? code : 'uz';
  document.documentElement.lang = lang;
  langSelect.value = lang;

  // data-i18n belgisi bor har bir elementga mos tarjimani qo‘yish
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = T[lang][el.dataset.i18n];
  });

  // Ism qo‘yiladigan joylar
  document.getElementById('heroTitle').textContent = T[lang].hero_title.replace('{ism}', ISM);
  document.getElementById('logo').textContent = ISM;
  document.getElementById('footName').textContent = ISM;
  document.getElementById('badge').textContent = ISM.charAt(0).toUpperCase();
  document.title = ISM + ' | Portfolio';

  try { localStorage.setItem('lang', lang); } catch (e) {}
}

langSelect.addEventListener('change', () => setLang(langSelect.value));

let savedLang = 'uz';
try { savedLang = localStorage.getItem('lang') || 'uz'; } catch (e) {}
setLang(savedLang);

/* =========================================================
   4. BURGER MENYU
   ========================================================= */
const burger = document.getElementById('burger');
const menu = document.getElementById('menu');
burger.addEventListener('click', () => menu.classList.toggle('open'));
menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => menu.classList.remove('open')));

/* =========================================================
   5. QORONG‘I / YORUG‘ REJIM
   ========================================================= */
const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
function setTheme(mode) {
  root.setAttribute('data-theme', mode);
  themeBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', mode); } catch (e) {}
}
let savedTheme = 'light';
try { savedTheme = localStorage.getItem('theme') || 'light'; } catch (e) {}
setTheme(savedTheme);
themeBtn.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* =========================================================
   6. SCROLL ANIMATSIYA
   ========================================================= */
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
      entry.target.querySelectorAll('.bar span').forEach(b => { b.style.width = b.dataset.level + '%'; });
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));


/* =========================================================
   8. LOYIHA "KO‘RISH" TUGMALARI
   Haqiqiy loyiha havolangiz bo‘lsa, shu yerga yozing: 1: "https://...".
   Havola bo‘sh bo‘lsa, kichik oyna ochiladi.
   ========================================================= */
const LINKS = { 1: "", 2: "", 3: "", 4: "" };
const modal = document.getElementById('modal');

document.querySelectorAll('[data-project]').forEach(btn => {
  btn.addEventListener('click', () => {
    const n = btn.dataset.project;
    if (EMBEDDED[n]) {
      openEmbedded(EMBEDDED[n]);                 // sayt ichiga joylangan loyiha
    } else if (LINKS[n]) {
      window.open(LINKS[n], '_blank', 'noopener');
    } else {
      document.getElementById('mTitle').textContent = T[lang]['p' + n + 't'];
      document.getElementById('mText').textContent = T[lang]['p' + n + 'd'];
      modal.hidden = false;
    }
  });
});

document.getElementById('mClose').addEventListener('click', () => modal.hidden = true);
modal.addEventListener('click', (e) => { if (e.target === modal) modal.hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.hidden = true; });

/* =========================================================
   9. SICHQONCHA YORUG‘LIGI
   Sichqoncha yurgan sari rangi (hue) o‘zgaradi.
   ========================================================= */
const glow = document.getElementById('glow');
let hue = 260;
if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.addEventListener('mousemove', (e) => {
    hue = (hue + 2) % 360;                                   // rangni sekin almashtirish
    glow.style.setProperty('--h', hue);
    glow.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
    glow.style.opacity = 1;
  });
  document.addEventListener('mouseleave', () => { glow.style.opacity = 0; });
}

document.getElementById('year').textContent = new Date().getFullYear();

function openEmbedded(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const blob = new Blob([bytes], { type: 'text/html;charset=utf-8' });
  window.open(URL.createObjectURL(blob), '_blank');
}
