 openD('<h3>Ota-onaga xabar</h3><div class="fld"><textarea id="rt" rows="5" class="ta">'+esc(txt)+'</textarea></div><p style="color:var(--mut);margin:0">Ota-ona: '+esc(s.par)+'</p><div class="acts"><button class="btn ghost" onclick="closeD()">Yopish</button><a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://t.me/share/url?url=&text='+encodeURIComponent(txt)+'">Telegram</a><button class="btn" onclick="copyT()">Nusxalash</button></div>')}
function copyT(){var t=document.getElementById("rt");t.select();try{navigator.clipboard.writeText(t.value).catch(function(){document.execCommand("copy")})}catch(e){document.execCommand("copy")}toast("Matn nusxalandi")}
function paidSum(){return S.reduce(function(a,s){return a+s.paid},0)}
function expSum(){return E.reduce(function(a,x){return a+x.sum},0)}
function teachers(){return ST.filter(function(u){return u.role==="teacher"})}
function rate(n){return RATE[n]==null?40:RATE[n]}
function sal(n){var r=0;G.forEach(function(g){if(g.t===n)S.forEach(function(s){if(s.g===g.id)r+=s.paid})});return Math.round(r*rate(n)/100)}
function salSum(){return teachers().reduce(function(a,u){return a+sal(u.n)},0)}
function attPct(){var p=0,t=0;Object.keys(att).forEach(function(g){Object.keys(att[g]).forEach(function(k){t++;if(att[g][k]==="p")p++})});return t?Math.round(p/t*100)+"%":"—"}
function vFin(){var t=st.ftab,tabs=[["rep","Hisobot"],["exp","Xarajatlar"],["sal","O‘qituvchi oyligi"],["tpl","Xabar shablonlari"]];if(st.role!=="admin"){tabs=tabs.filter(function(x){return x[0]!=="sal"});if(t==="sal")t="rep"}
 return '<div class="head"><h2>Moliya</h2></div><div class="gsel">'+tabs.map(function(x){return '<button class="'+(t===x[0]?"on":"")+'" onclick="st.ftab=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join("")+'</div>'+({rep:fRep,exp:fExp,sal:fSal,tpl:fTpl}[t])()}
function fRep(){var inc=paidSum(),ex=expSum(),sl=salSum();return '<div class="stats"><div class="card stat"><i class="ic c2">'+ICO.pay+'</i><small>Tushum</small><b>'+fmt(inc)+'</b></div><div class="card stat"><i class="ic c4">'+ICO.pay+'</i><small>Xarajat va oyliklar</small><b>'+fmt(ex+sl)+'</b></div><div class="card stat"><i class="ic c1">'+ICO.fin+'</i><small>Sof foyda</small><b>'+fmt(inc-ex-sl)+'</b></div><div class="card stat"><i class="ic c3">'+ICO.att+'</i><small>Davomat foizi</small><b>'+attPct()+'</b></div></div><div class="card"><h3>Hisobotni yuklab olish</h3><p style="color:var(--mut);margin:0 0 12px">Oktabr hisoboti Excel ochadigan CSV fayl: to‘lovlar, qarzdorlar va xarajatlar.</p><button class="btn" onclick="dlCsv()">CSV yuklab olish</button></div>'}
async function dlCsv(){var rows=[["Talaba","Guruh","To‘langan","Qarz","Holat"]];S.forEach(function(s){rows.push([s.n,grp(s.g).n,s.paid,debt(s),debt(s)>0?(s.paid>0?"Qisman":"Qarzdor"):"To‘langan"])});rows.push([]);rows.push(["Xarajat","Summa"]);E.forEach(function(x){rows.push([x.cat,x.sum])});rows.push(["Tushum",paidSum()],["Oyliklar",salSum()],["Sof foyda",paidSum()-expSum()-salSum()]);
 var csv="\uFEFF"+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
 try{var d=await claude.use("downloads");if(!d){toast("Yuklab olish bu ko‘rinishda mavjud emas");return}await d.save({filename:"ustoz-hisobot-oktabr.csv",data:csv});toast("Hisobot saqlandi")}catch(e){if(!e||e.code!=="declined")toast("Saqlab bo‘lmadi")}}
function fExp(){return '<div class="head"><h3>Xarajatlar</h3><button class="btn" onclick="addExp()">Xarajat qo‘shish</button></div>'+(E.length?'<div class="tw"><table><thead><tr><th>Kategoriya</th><th>Summa</th><th></th></tr></thead><tbody>'+E.map(function(x){return '<tr><td>'+esc(x.cat)+'</td><td>'+fmt(x.sum)+'</td><td><div class="seg"><button onclick="delExp('+x.id+')">O‘chirish</button></div></td></tr>'}).join("")+'</tbody></table></div><p style="margin-top:12px"><b>Jami:</b> '+fmt(expSum())+'</p>':'<div class="card empty">Xarajat kiritilmagan.</div>')}
function addExp(){openD('<h3>Yangi xarajat</h3><form onsubmit="saveExp(event)"><div class="fld"><label for="e1">Kategoriya</label><select id="e1"><option>Ijara</option><option>Kommunal</option><option>Reklama</option><option>Boshqa</option></select></div><div class="fld"><label for="e2">Summa (so‘m)</label><input id="e2" type="number" min="1000" step="1000" required></div><div class="acts"><button type="button" class="btn ghost" onclick="closeD()">Bekor qilish</button><button class="btn">Saqlash</button></div></form>')}
function saveExp(e){e.preventDefault();E.push({id:nid(E),cat:e1.value,sum:+e2.value});closeD();toast("Xarajat qo‘shildi");render()}
function delExp(id){E=E.filter(function(x){return x.id!=id});toast("Xarajat o‘chirildi");render()}
function fSal(){return '<div class="head"><h3>O‘qituvchi oyligi</h3></div><div class="tw"><table><thead><tr><th>O‘qituvchi</th><th>Guruhlar</th><th>Stavka, %</th><th>Oylik</th></tr></thead><tbody>'+teachers().map(function(u){return '<tr><td>'+av(u.n)+'</td><td>'+G.filter(function(g){return g.t===u.n}).length+'</td><td><input type="number" min="0" max="100" value="'+rate(u.n)+'" style="width:76px" aria-label="Stavka" onchange="setRate('+JSON.stringify(u.n).replace(/"/g,'&quot;')+',this.value)"></td><td><b>'+fmt(sal(u.n))+'</b></td></tr>'}).join("")+'</tbody></table></div><p style="color:var(--mut);margin-top:12px">Oylik = guruhlardagi talabalar to‘lagan summaning stavka foizi.</p>'}
function setRate(n,v){RATE[n]=Math.max(0,Math.min(100,+v||0));render()}
ICO.kab='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
ICO.gr='<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.3 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>';
ICO.log='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function grpB(id){return grp(id).b}
function applyBr(){var b=st.br;S=SALL.filter(function(s){return !b||grpB(s.g)===b});G=GALL.filter(function(g){return !b||g.b===b})}
function setBr(v){st.br=v;applyBr();var l=myG();st.gid=l.length?l[0].id:null;render()}
function sn(id){return SALL.filter(function(x){return x.id==id})[0].n}
function contact(){return '<div class="cnt"><span>Aloqa:</span><a href="tel:+998944750015">+998 94 475 00 15</a><a href="https://t.me/axadovs" target="_blank" rel="noopener">Telegram: @axadovs</a></div>'}
function avg(id){var r=GR[id]||[];return r.length?Math.round(r.reduce(function(a,x){return a+x.sc},0)/r.length):"—"}
function hwList(g){var h=HW.filter(function(x){return x.g==g});return h.length?h.map(function(x){return '<div class="li"><div>'+esc(x.t)+'</div><span>Muddat: '+esc(x.due)+'</span></div>'}).join(""):'<div class="empty">Hali vazifa berilmagan.</div>'}
function vGr(){var l=myG();if(!l.length)return '<div class="head"><h2>Baholar va vazifalar</h2></div><div class="card empty">Guruh yo‘q.</div>';
 var gid=l.some(function(g){return g.id==st.gid})?st.gid:l[0].id,sl=S.filter(function(s){return s.g==gid});
 return '<div class="head"><h2>Baholar va vazifalar</h2><button class="btn" onclick="addHw('+gid+')">Vazifa berish</button></div><div class="gsel">'+l.map(function(g){return '<button class="'+(g.id==gid?"on":"")+'" onclick="st.gid='+g.id+';render()">'+esc(g.n)+'</button>'}).join("")+'</div>'+
 (sl.length?'<div class="tw"><table><thead><tr><th>Talaba</th><th>Baholar</th><th>O‘rtacha</th><th>Yangi baho (0–100)</th></tr></thead><tbody>'+sl.map(function(s){var r=GR[s.id]||[];return '<tr><td>'+av(s.n)+'</td><td>'+(r.map(function(x){return x.sc}).join(", ")||"—")+'</td><td>'+avg(s.id)+'</td><td><div class="seg"><input type="number" min="0" max="100" id="gi'+s.id+'" style="width:72px" aria-label="Baho"><button onclick="setGr('+s.id+')">Qo‘yish</button></div></td></tr>'}).join("")+'</tbody></table></div>':'<div class="card empty">Bu guruhda hali talaba yo‘q.</div>')+
 '<div class="card" style="margin-top:14px"><h3>Uy vazifalari</h3>'+hwList(gid)+'</div>'}
function setGr(id){var v=document.getElementById("gi"+id).value;if(v===""||+v<0||+v>100){toast("Bahoni 0 dan 100 gacha kiriting");return}GR[id]=GR[id]||[];GR[id].push({sc:+v,n:"Baho "+(GR[id].length+1)});toast("Baho qo‘yildi: "+sn(id)+", "+v);render()}
function addHw(g){openD('<h3>Yangi uy vazifasi</h3><form onsubmit="saveHw(event,'+g+')"><div class="fld"><label for="h1">Vazifa</label><input id="h1" required></div><div class="fld"><label for="h2">Muddat</label><input id="h2" type="date" required></div><div class="acts"><button type="button" class="btn ghost" onclick="closeD()">Bekor qilish</button><button class="btn">Berish</button></div></form>')}
function saveHw(e,g){e.preventDefault();HW.push({id:nid(HW),g:g,t:h1.value.trim(),due:h2.value});closeD();toast("Vazifa berildi: "+grp(g).n);render()}
function vLog(){return '<div class="head"><h2>Harakatlar tarixi</h2></div>'+(LOG.length?'<div class="tw"><table><thead><tr><th>Vaqt</th><th>Kim</th><th>Harakat</th></tr></thead><tbody>'+LOG.slice(0,50).map(function(x){return '<tr><td>'+x.t+'</td><td>'+esc(x.w)+'</td><td>'+esc(x.a)+'</td></tr>'}).join("")+'</tbody></table></div>':'<div class="card empty">Hali harakat yo‘q. To‘lov, talaba yoki guruh o‘zgarganda shu yerda ko‘rinadi.</div>')}
function vKab(){var s=SALL.filter(function(x){return x.id===1})[0],g=grp(s.g),a=(att[s.g]||{})[s.id],as={p:"Keldi",a:"Kelmadi",e:"Sababli"}[a]||"Belgilanmagan",r=GR[s.id]||[];
 return '<div class="hero2"><div><h2>'+esc(s.n)+'</h2><p>'+esc(g.n)+' · '+g.d+' · '+g.tm+' · '+g.r+'</p></div></div><div class="stats"><div class="card stat"><i class="ic c2">'+ICO.pay+'</i><small>To‘lov holati</small><b style="font-size:1.2rem">'+tag(s)+'</b></div><div class="card stat"><i class="ic c4">'+ICO.pay+'</i><small>Qarz</small><b>'+fmt(debt(s))+'</b></div><div class="card stat"><i class="ic c3">'+ICO.gr+'</i><small>O‘rtacha baho</small><b>'+avg(s.id)+'</b></div><div class="card stat"><i class="ic c1">'+ICO.att+'</i><small>Oxirgi davomat</small><b style="font-size:1.2rem">'+as+'</b></div></div><div class="two"><div class="card"><h3>Baholar</h3>'+(r.length?r.map(function(x){return '<div class="li"><div>'+esc(x.n)+'</div><b>'+x.sc+'</b></div>'}).join(""):'<div class="empty">Hali baho yo‘q.</div>')+'</div><div class="card"><h3>Uy vazifalari</h3>'+hwList(g.id)+'</div></div>'}
function fTpl(){return '<div class="card"><h3>Xabar shablonlari</h3><p style="color:var(--mut);margin:0 0 14px">[ota-ona], [talaba], [oy], [summa] so‘zlari avtomatik almashtiriladi.</p><div class="fld"><label for="t1">Qarzdor talaba uchun</label><textarea id="t1" rows="3" class="ta" onchange="TPL.debt=this.value;toast(\'Shablon saqlandi\')">'+esc(TPL.debt)+'</textarea></div><div class="fld"><label for="t2">Darsga kelmagan talaba uchun</label><textarea id="t2" rows="3" class="ta" onchange="TPL.abs=this.value;toast(\'Shablon saqlandi\')">'+esc(TPL.abs)+'</textarea></div></div>'}
render();
</script>
</body>
